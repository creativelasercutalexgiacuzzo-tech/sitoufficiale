services:
  - type: web
    name: sito-vetrina
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: BREVO_API_KEY
        sync: false
      - key: CONTACT_TO_EMAIL
        sync: false
      - key: SENDER_EMAIL
        sync: false
      - key: SENDER_NAME
        value: "Sito web"
      - key: BREVO_LIST_ID
        sync: false
